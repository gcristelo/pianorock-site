<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Piano Rock</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#000;
  font-family:Arial, Helvetica, sans-serif;
  overflow-x:hidden;
}

/* =========================
   SECTION
========================= */

.experience-section{
  width:100%;
  min-height:100vh;
  background:#050505;
  color:white;

  display:flex;
  align-items:center;
  justify-content:space-between;

  padding:60px 40px;
  gap:70px;

  overflow:hidden;
}

/* =========================
   TEXT
========================= */

.experience-text{
  width:420px;
  flex-shrink:0;
  z-index:2;
}

.experience-text .subtitle{
  color:#2f73ff;
  font-size:28px;
  font-weight:900;
  letter-spacing:8px;
  line-height:1.1;

  margin-bottom:35px;
}

.experience-text h1{
  font-size:115px;
  font-weight:900;
  line-height:0.9;
  letter-spacing:-5px;

  margin-bottom:45px;
}

.video-btn{
  display:inline-flex;
  align-items:center;
  gap:10px;

  color:white;
  text-decoration:none;

  border:1px solid rgba(255,255,255,0.9);
  border-radius:10px;

  padding:18px 30px;

  font-size:16px;
  font-weight:800;

  transition:0.3s;
}

.video-btn:hover{
  background:white;
  color:black;
}

/* =========================
   GALLERY
========================= */

.experience-gallery{
  display:flex;
  gap:22px;

  flex:1;
  overflow-x:auto;

  scrollbar-width:none;
}

.experience-gallery::-webkit-scrollbar{
  display:none;
}

.experience-gallery img{
  width:310px;
  height:430px;

  object-fit:cover;

  border-radius:10px;

  border:1px solid rgba(46,111,255,0.5);

  flex-shrink:0;

  transition:0.4s;
}

.experience-gallery img:hover{
  transform:scale(1.03);
}

/* =========================
   MOBILE
========================= */

@media(max-width:900px){

  .experience-section{
    flex-direction:column;
    align-items:flex-start;

    padding:40px 22px;

    gap:40px;
  }

  .experience-text{
    width:100%;
  }

  .experience-text .subtitle{
    font-size:18px;
    letter-spacing:5px;
  }

  .experience-text h1{
    font-size:64px;
    letter-spacing:-2px;
  }

  .video-btn{
    font-size:14px;
    padding:15px 24px;
  }

  .experience-gallery{
    width:100%;
  }

  .experience-gallery img{
    width:240px;
    height:320px;
  }

}

</style>
</head>

<body>

<section class="experience-section">

  <!-- TEXTO -->
  <div class="experience-text">

    <div class="subtitle">
      MAIS DO QUE UM<br>
      SHOW.
    </div>

    <h1>
      UMA<br>
      EXPERIÊNCIA.
    </h1>

    <a href="#" class="video-btn">
      ▶ ASSISTA AO VÍDEO
    </a>

  </div>

  <!-- FOTOS -->
  <div class="experience-gallery">

    <img src="foto1.jpg" alt="Piano Rock">

    <img src="foto2.jpg" alt="Piano Rock">

    <img src="foto3.jpg" alt="Piano Rock">

    <img src="foto4.jpg" alt="Piano Rock">

    <img src="foto5.jpg" alt="Piano Rock">

  </div>

</section>

</body>
</html>
